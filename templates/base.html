<!doctype html>
<html><head><meta charset="utf-8"><style>{{{tokens}}}
{{{css}}}</style></head>
<body>
<div class="slide {{theme}} t-{{type}}{{{mascotClass}}}">
  {{{content}}}
  <div class="frame-label mono">FORWARD THINKING CO / {{pillar}}</div>
  <div class="frame-num mono">{{num}}</div>
  {{{arrow}}}
  <svg class="grain" xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script>
// Shrink each [data-fit] headline until it fits its box (after webfonts load).
document.fonts.ready.then(() => {
for (const el of document.querySelectorAll('[data-fit]')) {
  const box = el.closest('.fit-box') || el.parentElement;
  const cssMax = parseFloat(getComputedStyle(box).maxHeight);
  const limitH = Number.isFinite(cssMax) ? cssMax : box.clientHeight;
  const tooBig = () => el.scrollHeight > limitH || el.scrollWidth > box.clientWidth;
  let size = +el.dataset.max;
  const min = +el.dataset.min;
  el.style.fontSize = size + 'px';
  while (size > min && tooBig()) {
    size -= 2;
    el.style.fontSize = size + 'px';
  }
}
window.__fitted = true;
});
</script>
</body></html>
