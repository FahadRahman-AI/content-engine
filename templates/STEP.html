<div class="area" style="justify-content:space-between">
  <div class="num{{numClass}}">{{step}}</div>
  <div>
    <div class="fit-box">
      <h2 class="headline narrow" data-fit data-max="88" data-min="64">{{{headline}}}</h2>
    </div>
    {{#body}}<p class="body-text narrow">{{body}}</p>{{/body}}
  </div>
</div>
{{#mascot}}<div class="mascot">{{{mascot}}}</div>{{/mascot}}
